# 发票归档 — 自动打包 workflow
# 触发：推送 v* 标签 或 手动触发
# 产出：便携版 EXE + Inno Setup 安装包（GitHub Actions artifacts）
#
# 用法：
#   git push origin v5.6.1     # 自动触发
#   或 GitHub 页面 → Actions → build → Run workflow
#
# 注：PyInstaller 不能交叉编译，Windows EXE 必须在 Windows 环境打包，
# 因此使用 windows-latest runner（原生 Windows，无需 Wine）。

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Diagnostics
        shell: pwsh
        run: |
          python --version
          pip show pyinstaller | Select-String "Version"
          Get-ChildItem src | Select-Object -First 5 Name
          Get-ChildItem *.spec | Select-Object Name

      - name: Install UPX
        run: choco install upx -y --no-progress

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # choco 包安装到 Program Files (x86)\Inno Setup 6
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            # 兼容 choco 新包路径
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $iscc) { throw "ISCC.exe not found" }
            Write-Host "ISCC at: $($iscc.FullName)"
          }

      - name: Build EXE (PyInstaller + UPX)
        run: |
          pyinstaller "发票归档.spec" --clean --noconfirm
        shell: pwsh

      - name: Prepare release artifacts
        shell: pwsh
        run: pwsh -File scripts/release_artifacts.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "dist/setup.iss"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lan-invoice-build
          path: |
            dist/lan-invoice_*.exe
          retention-days: 30

  # ── Nuitka 并行实验（评估迁移可行性，不影响主发布流程）──
  # 目标：对比 PyInstaller（主 job）与 Nuitka 的体积/启动/误报。
  # 结论未定前 continue-on-error，失败不阻塞发布。
  experiment-nuitka:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow nuitka zstandard

      - name: Build with Nuitka (onefile)
        shell: pwsh
        run: |
          # Nuitka 2.x 语法：--mode=onefile（单文件）、--enable-plugins 复数
          python -m nuitka --mode=onefile `
            --enable-plugins=pyqt5,matplotlib `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --include-data-dir=src/ui/icons=ui/icons `
            --assume-yes-for-downloads `
            --output-dir=build-nuitka `
            --output-filename=lan-invoice-nuitka.exe `
            src/invoice_tool.py

      - name: Smoke test (MCP over stdio)
        shell: pwsh
        run: |
          # 注意：管道末尾不能放 Select-Object——cmdlet 会清空 $LASTEXITCODE
          # （实测 $null -ne 0 误判失败），须让 exe 作为管道最后一个命令
          $req = '{"jsonrpc":"2.0","id":1,"method":"server/discover"}'
          $resp = $req | & ".\build-nuitka\lan-invoice-nuitka.exe" --mcp 2>&1
          if ($LASTEXITCODE -ne 0) { throw "MCP 冒烟失败，退出码 $LASTEXITCODE" }
          $obj = ($resp | Select-Object -First 1) | ConvertFrom-Json
          if ($obj.result.serverInfo.name -ne "invoice-tool") { throw "响应异常: $resp" }
          Write-Host "MCP 冒烟通过: $($obj.result.serverInfo.name) v$($obj.result.serverInfo.version)"

      - name: Size report
        shell: pwsh
        run: |
          $f = Get-Item ".\build-nuitka\lan-invoice-nuitka.exe"
          Write-Host "Nuitka 单文件产物大小: $([math]::Round($f.Length/1MB, 2)) MB"

      - name: Upload Nuitka experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-invoice-nuitka-experiment
          path: build-nuitka/lan-invoice-nuitka.exe
          retention-days: 14
