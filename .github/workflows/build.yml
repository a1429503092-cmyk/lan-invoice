# 发票归档 — 自动打包 workflow
# 触发：推送 v* 标签 或 手动触发
# 产出：便携版 EXE + Inno Setup 安装包（GitHub Actions artifacts）
#
# 用法：
#   git push origin v5.6.1     # 自动触发
#   或 GitHub 页面 → Actions → build → Run workflow
#
# 注：PyInstaller 不能交叉编译，Windows EXE 必须在 Windows 环境打包，
# 因此使用 windows-latest runner（原生 Windows，无需 Wine）。

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Diagnostics
        shell: pwsh
        run: |
          python --version
          pip show pyinstaller | Select-String "Version"
          Get-ChildItem src | Select-Object -First 5 Name
          Get-ChildItem *.spec | Select-Object Name

      - name: Install UPX
        run: choco install upx -y --no-progress

      - name: Install Inno Setup 6 (official installer)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.4.1.exe" -OutFile "$env:TEMP\innosetup.exe"
          Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { throw "ISCC.exe not found after install" }

      - name: Build EXE (PyInstaller + UPX)
        run: |
          pyinstaller "发票归档.spec" --clean --noconfirm
        shell: pwsh

      - name: Prepare release artifacts
        shell: pwsh
        run: pwsh -File scripts/release_artifacts.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "dist/setup.iss"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lan-invoice-build
          path: |
            dist/lan-invoice_*.exe
          retention-days: 30
