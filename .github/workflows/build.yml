# 发票归档 — 自动打包 workflow
# 触发：推送 v* 标签 或 手动触发
# 产出：便携版 EXE + Inno Setup 安装包（GitHub Actions artifacts）
#
# 用法：
#   git push origin v5.6.1     # 自动触发
#   或 GitHub 页面 → Actions → build → Run workflow
#
# 注：PyInstaller 不能交叉编译，Windows EXE 必须在 Windows 环境打包，
# 因此使用 windows-latest runner（原生 Windows，无需 Wine）。

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ── 安装包（主产物）：Nuitka standalone + Inno Setup ──
  # standalone 目录启动免解压（MCP 0.2s vs onefile 2.15s），
  # 安装版 EXE 固定名 lan-invoice.exe，覆盖更新后 MCP 配置不变
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow nuitka zstandard

      - name: Build with Nuitka (standalone)
        shell: pwsh
        run: |
          # Nuitka 2.x 语法：--mode=standalone（目录，免解压）、--enable-plugins 复数
          python -m nuitka --mode=standalone `
            --enable-plugins=pyqt5,matplotlib `
            --windows-console-mode=disable `
            --windows-icon-from-ico=icon.ico `
            --include-data-dir=src/ui/icons=ui/icons `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=lan-invoice.exe `
            src/invoice_tool.py

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $iscc) { throw "ISCC.exe not found" }
            Write-Host "ISCC at: $($iscc.FullName)"
          }

      - name: Prepare installer script
        shell: pwsh
        run: pwsh -File scripts/release_artifacts.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "dist/setup.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-invoice-installer
          path: |
            dist/lan-invoice_*_setup.exe
          retention-days: 30

  # ── 便携版：PyInstaller 单文件（保持现状，启动稍慢但单文件易分发）──
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Install UPX
        shell: pwsh
        run: |
          # UPX 仅做压缩优化，choco 偶发故障时跳过，不阻塞发布
          choco install upx -y --no-progress | Out-Null
          if (-not $?) { Write-Warning "UPX 安装失败，跳过压缩（不影响打包）" }

      - name: Build EXE (PyInstaller + UPX)
        run: |
          pyinstaller "发票归档.spec" --clean --noconfirm
        shell: pwsh

      - name: Rename to versioned portable
        shell: pwsh
        run: |
          $ver = (Get-Content "src/version.py" | Select-String 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Copy-Item "dist/lan-invoice.exe" "dist/lan-invoice_$ver.exe" -Force
          Write-Host "便携版: lan-invoice_$ver.exe"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-invoice-portable
          path: |
            dist/lan-invoice_*.exe
          retention-days: 30
